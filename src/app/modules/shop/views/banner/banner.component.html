<div class="page-layout">

  <!-- PUBLICIDAD SUPERIOR (mobile) -->
  <div class="ads ads-top" *ngIf="publicidadIzquierda">

    <img [src]="publicidadIzquierda.urlImagen">

    <a
      [href]="publicidadIzquierda.urlBoton"
      target="_blank">

      <button class="ads-btn">
        Consultar
      </button>

    </a>

  </div>

  <div class="layout-row">

    <!-- PUBLICIDAD IZQUIERDA (desktop) -->
    <div class="ads ads-left" *ngIf="publicidadIzquierda">

      <img [src]="publicidadIzquierda.urlImagen">

      <a
        [href]="publicidadIzquierda.urlBoton"
        target="_blank">

        <button class="ads-btn">
          Consultar
        </button>

      </a>

    </div>

    <!-- CONTENIDO CENTRAL -->
    <div class="contenido">

      <!-- ================= BANNER ================= -->
      <div *ngIf="mediaItems.length > 0; else sinImagenes"
           id="bannerCarousel"
           class="carousel slide banner-container"
           data-bs-ride="carousel"
           data-bs-interval="3000"
           data-bs-pause="false">

        <div class="carousel-inner banner">

          <div class="carousel-item position-relative"
               *ngFor="let img of mediaItems; let i = index"
               [class.active]="i === 0">

            <ng-container *ngIf="img.tipo === 'imagen'; else videoTemplate">

              <img
                [src]="img.url"
                class="d-block w-100" />

            </ng-container>

            <ng-template #videoTemplate>

              <video
                [src]="img.url"
                autoplay
                muted
                loop
                playsinline
                style="width: 100%; max-height: 400px; object-fit: contain;">

              </video>

            </ng-template>

          </div>

        </div>

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#bannerCarousel"
                data-bs-slide="prev">

          <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next"
                type="button"
                data-bs-target="#bannerCarousel"
                data-bs-slide="next">

          <span class="carousel-control-next-icon"></span>

        </button>

      </div>

      <!-- ================= SUB BANNER ================= -->
      <div *ngIf="subBannerItems?.length > 0"
           id="subBannerCarousel"
           class="carousel slide sub-banner-container"
           data-bs-ride="carousel"
           data-bs-interval="4000"
           data-bs-pause="false">

        <div class="carousel-inner sub-banner">

          <div class="carousel-item position-relative"
               *ngFor="let item of subBannerItems; let i = index"
               [class.active]="i === 0">

            <ng-container *ngIf="item.tipo === 'imagen'; else subVideoTemplate">

              <img
                [src]="item.url"
                class="d-block w-100" />

            </ng-container>

            <ng-template #subVideoTemplate>

              <video
                [src]="item.url"
                autoplay
                muted
                loop
                playsinline
                style="width: 100%; max-height: 250px; object-fit: contain;">

              </video>

            </ng-template>

          </div>

        </div>

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#subBannerCarousel"
                data-bs-slide="prev">

          <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next"
                type="button"
                data-bs-target="#subBannerCarousel"
                data-bs-slide="next">

          <span class="carousel-control-next-icon"></span>

        </button>

      </div>

      <ng-template #sinImagenes>

        <p class="text-center mt-3">
          No hay imágenes disponibles para el banner.
        </p>

      </ng-template>

    </div>

    <!-- PUBLICIDAD DERECHA (desktop) -->
    <div class="ads ads-right" *ngIf="publicidadDerecha">

      <img [src]="publicidadDerecha.urlImagen">

      <a
        [href]="publicidadDerecha.urlBoton"
        target="_blank">

        <button class="ads-btn">
          Consultar
        </button>

      </a>

    </div>

  </div>

  <!-- PUBLICIDAD INFERIOR (mobile) -->
  <div class="ads ads-bottom" *ngIf="publicidadDerecha">

    <img [src]="publicidadDerecha.urlImagen">

    <a
      [href]="publicidadDerecha.urlBoton"
      target="_blank">

      <button class="ads-btn">
        Consultar
      </button>

    </a>

  </div>

</div>
